# Local OpenArm 2.0 VR dataflow for a bimanual arm without cameras or a cell lifter.
# Test dataflow-vr-mujoco.yaml successfully before running this on hardware.
nodes:
  - id: ui
    build: pip install -e nodes/dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata_no_camera.yaml"
    inputs:
      tick: dora/timer/secs/1
      button_a:
        source: udp-receiver/button_a
        queue_size: 100
      button_b:
        source: udp-receiver/button_b
        queue_size: 100
      arm_status_right: follower-right/status
      arm_status_left: follower-left/status
    outputs:
      - command
      - arm_command

  - id: quittable-tick-leader
    build: pip install -e nodes/dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: udp-receiver
    build: pip install -e nodes/dora-openarm-vr
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_y
      - button_a
      - button_b
      - button_x
      - status

  - id: ik
    build: pip install -e nodes/dora-openarm-kinematics
    path: dora-openarm-ik
    # posture-cost=0 is required when syncing from a physical pose; otherwise
    # Mink also pulls the arms toward the MuJoCo home posture.
    args: "--mode bimanual --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0 --lm-damping 0.01"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left: udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left: udp-receiver/trigger_left
      state_right: follower-right/state
      state_left: follower-left/state
    outputs:
      - position_left
      - position_right
      - status

  - id: mujoco-viewer
    build: pip install -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --viewer --debug-frames"
    inputs:
      # Digital twin: render measured physical qpos, not ideal IK commands.
      position_left: follower-left/state
      position_right: follower-right/state
      pose_right: udp-receiver/pose_right
      pose_left: udp-receiver/pose_left
      joystick_y: udp-receiver/joystick_y
    outputs:
      - status

  - id: follower-right
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side right --align-trigger gripper --config /home/robin/open_arm/openarm_safe_current.yaml"
    inputs:
      # State polling runs while stopped, allowing IK and MuJoCo to align
      # before any physical motor is enabled.
      request_state: dora/timer/millis/20
      move_position: ik/position_right
      command: ui/arm_command
    outputs:
      - state
      - status

  - id: follower-left
    build: pip install -e nodes/dora-openarm
    path: dora-openarm
    args: "--side left --align-trigger gripper --config /home/robin/open_arm/openarm_safe_current.yaml"
    inputs:
      request_state: dora/timer/millis/20
      move_position: ik/position_left
      command: ui/arm_command
    outputs:
      - state
      - status

  - id: recorder
    build: pip install -e nodes/dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata_no_camera.yaml"
      DIRECTORY: "vr_data_no_camera"
    inputs:
      command: ui/command
      arm_right_action: ik/position_right
      arm_right_observation: follower-right/state
      arm_left_action: ik/position_left
      arm_left_observation: follower-left/state
