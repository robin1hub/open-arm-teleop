# Simulation-only OpenArm action-path test.
# No VR, CAN interface, or physical-arm driver is used by this dataflow.
nodes:
  - id: action-source
    build: pip install -e nodes/dora-openarm-dummy-ker
    path: dora-openarm-dummy-ker
    inputs:
      # The bundled trajectory uses 300 samples per half-cycle.
      # At 10 ms/sample the arms take 3 seconds to reach each endpoint.
      tick: dora/timer/millis/10
    outputs:
      - position_right
      - position_left
      - follower_position_right
      - follower_position_left
      - joystick_x
      - joystick_y
      - joystick_button

  - id: openarm-mujoco
    build: pip install -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--scene demo --keyframe home --viewer"
    inputs:
      position_right: action-source/follower_position_right
      position_left: action-source/follower_position_left
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
