# Safe local OpenArm 2.0 configuration for first physical-driver tests.
joint_limits:
  right_arm:
    - [-1.3, 2.0]
    - [-0.174533, 2.0]
    - [-1.75, 1.75]
    - [0.0, 2.443461]
    - [-1.570796, 1.570796]
    - [-0.785398, 0.785398]
    - [-1.570796, 1.570796]
    - [-1.047198, 0.4]
  left_arm:
    - [-2.0, 1.396263]
    - [-2.0, 0.174533]
    - [-1.75, 1.75]
    - [0.0, 2.443461]
    - [-1.570796, 1.570796]
    - [-0.785398, 0.785398]
    - [-1.570796, 1.570796]
    - [-0.4, 1.047198]

joint_offsets:
  right_arm: [0.0, -0.506145, 1.570796, -1.745329, 0.0, 0.331612, -1.570796, 0.0]
  left_arm: [0.0, 0.506145, -1.570796, -1.745329, 0.0, -0.331612, 1.570796, 0.0]

# Maximum change between two consecutive driver commands, in radians.
joint_delta_position_limits: [0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

can_interface:
  right_arm: "can0"
  left_arm: "can1"

motor_config:
  types: ['DM8009', 'DM8009', 'DM4340', 'DM4340', 'DM4310', 'DM4310', 'DM4310', 'DM4310']
  send_ids: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
  recv_ids: [0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18]

# All motors were configured and tested in MIT mode.
gripper_posforce: false
gripper_posforce_limits: [5.0, 0.5]

control_gains:
  kps: [70.0, 70.0, 80.0, 150.0, 20.0, 20.0, 20.0, 20.0]
  kds: [2.75, 2.5, 2.0, 2.0, 0.8, 0.8, 0.8, 0.8]

# Never move on start or stop. Start takes over at the measured pose; stop
# disables immediately. Higher-level alignment must produce any motion.
start:
  moves: []
stop:
  moves: []
